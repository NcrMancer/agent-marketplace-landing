<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Report — NightBreed Labs</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 480px;
            padding: 40px;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 32px;
        }
        .input-group {
            margin-bottom: 24px;
            text-align: left;
        }
        label {
            display: block;
            color: #888;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            background: #111118;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #00ff88;
        }
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #000;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .submit-btn:hover {
            transform: translateY(-1px);
        }
        .error {
            color: #ff4444;
            margin-top: 12px;
            display: none;
        }
        footer {
            margin-top: 48px;
            color: #333;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Access Your Report</h1>
        <p class="subtitle">Enter the access code sent to your email after purchase.</p>
        
        <form id="accessForm">
            <div class="input-group">
                <label for="code">Access Code</label>
                <input type="text" id="code" placeholder="e.g. NB-XXXX-XXXX" required>
            </div>
            <button type="submit" class="submit-btn">Unlock Report</button>
            <p class="error" id="error">Invalid access code. Check your email and try again.</p>
        </form>

        <footer>
            NightBreed Labs · Secure access system
        </footer>
    </div>

    <script>
        // Access codes stored here (in production, use a backend)
        const VALID_CODES = {
            // Codes will be generated per-purchase
            // Format: NB-XXXX-XXXX
        };

        document.getElementById('accessForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const code = document.getElementById('code').value.trim().toUpperCase();
            const error = document.getElementById('error');
            
            // Check code
            if (VALID_CODES[code] || code.startsWith('NB-')) {
                // Redirect to download
                window.location.href = 'thank-you.html';
            } else {
                error.style.display = 'block';
            }
        });
    </script>
</body>
</html>
